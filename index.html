<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
    }

    /* Tabs stylés */
    .tabs {
        text-align: center;
        margin-bottom: 30px;
    }

    .tabs button {
        padding: 12px 25px;
        margin: 5px;
        background: #222;
        border-radius: 8px;
        border: 1px solid #333;
        cursor: pointer;
        font-size: 1.1em;
        color: #eee;
        transition: 0.2s;
    }

    .tabs button:hover {
        background: #333;
    }

    .tabs button.active {
        background: #555;
        border-color: #777;
    }

    /* Grille */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: #1c1c1c;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #333;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .card .info {
        padding: 15px;
    }
</style>
</head>

<body>

<h1>Mes Projets</h1>

<!-- TABS -->
<div class="tabs">
    <button data-filter="all" class="active">All</button>
    <button data-filter="windows">Windows</button>
    <button data-filter="linux">Linux</button>
    <button data-filter="mac">MacOS</button>
    <button data-filter="android">Android</button>
    <button data-filter="web">Web</button>
</div>

<!-- GRILLE -->
<div class="grid">

    <a class="card windows" href="#">
        <img src="https://via.placeholder.com/400x200?text=Windows">
        <div class="info">
            <h3>Projet Windows</h3>
            <p>.exe</p>
        </div>
    </a>

    <a class="card linux" href="#">
        <img src="https://via.placeholder.com/400x200?text=Linux">
        <div class="info">
            <h3>Projet Linux</h3>
            <p>Binaire</p>
        </div>
    </a>

    <a class="card mac" href="#">
        <img src="https://via.placeholder.com/400x200?text=MacOS">
        <div class="info">
            <h3>Projet MacOS</h3>
            <p>Build Mac</p>
        </div>
    </a>

    <a class="card android" href="#">
        <img src="https://via.placeholder.com/400x200?text=Android">
        <div class="info">
            <h3>Projet Android</h3>
            <p>APK</p>
        </div>
    </a>

    <a class="card web" href="#">
        <img src="https://via.placeholder.com/400x200?text=Web">
        <div class="info">
            <h3>Projet Web</h3>
            <p>Site / WebApp</p>
        </div>
    </a>

</div>

<!-- SCRIPT DE FILTRAGE -->

    const cards = document.querySelectorAll(".card");
