<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
    }

    /* Tabs (labels only) */
    .tab-buttons {
        text-align: center;
        margin-bottom: 30px;
    }

    .tab-buttons label {
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        background: #222;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    input[type="radio"] {
        display: none;
    }

    input[type="radio"]:checked + label {
        background: #555;
    }

    /* Grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: #1c1c1c;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #333;
        display: none;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .card .info {
        padding: 15px;
    }

    /* Filtering */
    #all:checked ~ .grid .card { display: block; }
    #windows:checked ~ .grid .windows { display: block; }
    #linux:checked ~ .grid .linux { display: block; }
    #mac:checked ~ .grid .mac { display: block; }
    #android:checked ~ .grid .android { display: block; }
    #web:checked ~ .grid .web { display: block; }
</style>
</head>

<body>

<h1>Mes Projets</h1>

<!-- Inputs radio (NE PAS METTRE DANS UN DIV) -->
<input type="radio" id="all" name="tab" checked>
<label for="all" class="tab-buttons">All</label>

<input type="radio" id="windows" name="tab">
<label for="windows" class="tab-buttons">Windows</label>

<input type="radio" id="linux" name="tab">
<label for="linux" class="tab-buttons">Linux</label>

<input type="radio" id="mac" name="tab">
<label for="mac" class="tab-buttons">MacOS</label>

<input type="radio" id="android" name="tab">
<label for="android" class="tab-buttons">Android</label>

<input type="radio" id="web" name="tab">
<label for="web" class="tab-buttons">Web</label>

<!-- Grille (DOIT ÊTRE JUSTE APRÈS LES INPUTS) -->
<div class="grid">

    <a class="card windows" href="#">
        <img src="https://via.placeholder.com/400x200?text=Windows">
        <div class="info">
            <h3>Projet Windows</h3>
            <p>.exe</p>
        </div>
    </a>

    <a class="card linux" href="#">
        <img src="https://via.placeholder.com/400x200?text=Linux">
        <div class="info">
            <h3>Projet Linux</h3>
            <p>Binaire</p>
        </div>
    </a>

    <a class="card mac" href="#">
        <img src="https://via.placeholder.com/400x200?text=MacOS">
        <div class="info">
            <h3>Projet MacOS</h3>
            <p>Build Mac</p>
        </div>
    </a>

    <a class="card android" href="#">
        <img src="https://via.placeholder.com/400x200?text=Android">
        <div class="info">
            <h3>Projet Android</h3>
            <p>APK</p>
        </div>
    </a>

    <a class="card web" href="#">
        <img src="https://via.placeholder.com/400x200?text=Web">
        <div class="info">
            <h3>Projet Web</h3>
            <p>Site / WebApp</p>
        </div>
    </a>

</div>

</body>
</html>
