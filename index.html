<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>

<link rel="stylesheet" href="style.css">
<script src="lang.js" defer></script>
<script src="filter.js" defer></script>

</head>
<body>

<div class="header">
    <h1 data-i18n="title"></h1>

    <div class="header-right">
        <select id="lang" class="lang-select">
            <option value="fr">FR</option>
            <option value="en">EN</option>
        </select>
    </div>
</div>

<div class="tabs">
    <button data-filter="all" class="active" data-i18n="tab_all"></button>

    <button data-filter="windows" class="tab-icon windows" data-i18n="tab_windows"></button>
    <button data-filter="linux" class="tab-icon linux" data-i18n="tab_linux"></button>
    <button data-filter="mac" class="tab-icon mac" data-i18n="tab_mac"></button>
    <button data-filter="android" class="tab-icon android" data-i18n="tab_android"></button>
    <button data-filter="web" class="tab-icon web" data-i18n="tab_web"></button>
</div>

<div class="grid">

    <a class="card windows" href="#">
        <img src="https://via.placeholder.com/400x200?text=Windows">
        <div class="info">
            <h3 data-i18n="win_title"></h3>
            <p data-i18n="win_desc"></p>
        </div>
    </a>

    <a class="card linux" href="#">
        <img src="https://via.placeholder.com/400x200?text=Linux">
        <div class="info">
            <h3 data-i18n="linux_title"></h3>
            <p data-i18n="linux_desc"></p>
        </div>
    </a>

    <a class="card mac" href="#">
        <img src="https://github.com/Spiritecho777/SpiritEcho777.github.io/blob/main/ressources/TuxWhisperer.png?raw=true">
        <div class="info">
            <h3 data-i18n="mac_title1"></h3>
            <p data-i18n="mac_desc1"></p>
        </div>
    </a>

    <a class="card android" href="#">
        <img src="https://via.placeholder.com/400x200?text=Android">
        <div class="info">
            <h3 data-i18n="android_title"></h3>
            <p data-i18n="android_desc"></p>
        </div>
    </a>

    <a class="card web" href="#">
        <img src="https://via.placeholder.com/400x200?text=Web">
        <div class="info">
            <h3 data-i18n="web_title"></h3>
            <p data-i18n="web_desc"></p>
        </div>
    </a>

</div>

</body>
</html>
