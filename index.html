<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
    }

    /* Onglets */
    .tabs {
        text-align: center;
        margin-bottom: 30px;
    }

    .tabs input {
        display: none;
    }

    .tabs label {
        display: inline-block;
        padding: 10px 20px;
        margin: 5px;
        background: #222;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .tabs label:hover {
        background: #333;
    }

    .tabs input:checked + label {
        background: #555;
    }

    /* Grille */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: #1c1c1c;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.2s;
        border: 1px solid #333;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .card .info {
        padding: 15px;
    }

    .card .info h3 {
        margin: 0;
        font-size: 1.3em;
        color: #fff;
    }

    .card .info p {
        margin: 8px 0 0;
        color: #bbb;
        font-size: 0.9em;
    }

    /* Filtrage CSS */
    .card { display: none; }

    #all:checked ~ .grid .card { display: block; }
    #windows:checked ~ .grid .windows { display: block; }
    #linux:checked ~ .grid .linux { display: block; }
    #mac:checked ~ .grid .mac { display: block; }
    #android:checked ~ .grid .android { display: block; }
    #web:checked ~ .grid .web { display: block; }

</style>
</head>
<body>

<h1>Mes Projets</h1>

<div class="tabs">
    <input type="radio" id="all" name="tab" checked>
    <label for="all">All</label>

    <input type="radio" id="windows" name="tab">
    <label for="windows">Windows</label>
