<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
    }

    /* Container des tabs */
    .tab-buttons {
        text-align: center;
        margin-bottom: 30px;
    }

    /* Style des labels */
    .tab-buttons label {
        display: inline-block;
        padding: 12px 25px;
        margin: 5px;
        background: #222;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        font-size: 1.1em;
        border: 1px solid #333;
    }

    .tab-buttons label:hover {
        background: #333;
    }

    /* Inputs radio invisibles */
    input[type="radio"] {
        display: none;
    }

    /* Style du tab actif */
    input[type="radio"]:checked + label {
        background: #555;
        border-color: #777;
    }

    /* Grille */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        max-width: 1200px;
        margin: auto;
    }

    .card {
        background: #1c1c1c;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #333;
        display: none;
        transition: 0.2s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .card .info {
        padding: 15px;
    }

    /* Filtrage */
    #all:checked ~ .grid .card { display: block; }
    #windows:checked ~ .grid .windows { display: block; }
    #linux:checked ~ .grid .linux { display: block; }
    #mac:checked ~ .grid .mac { display: block; }
    #android:checked ~ .grid .android { display: block; }
    #web:checked ~ .grid .web { display: block; }
</style>
</head>

<body>

<h1>Mes Projets</h1>

<!-- INPUTS RADIO (NE PAS METTRE DANS UN DIV) -->
<div style="text-align:center;">
    <input type="radio" id="all" name="tab" checked>
    <label for="all">All</label>

    <input type="radio" id="windows" name="tab">
    <label for="windows">Windows</label>

    <input type="radio" id="linux" name="tab">
    <label for="linux">Linux</label>

    <input type="radio" id="mac" name="tab">
    <label for="mac">MacOS</label>

    <input type="radio" id="android" name="tab">
    <label for="android">Android</label>
